name = "corviraptor_dot_dev"
version = "1.0.0"
target = "javascript"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
modem = ">= 2.1.3 and < 3.0.0"
maud = ">= 2.0.0 and < 3.0.0"
mork = ">= 1.12.1 and < 2.0.0"
simplifile = ">= 2.6.0 and < 3.0.0"
rsvp = ">= 2.0.0 and < 3.0.0"
tom = ">= 2.1.0 and < 3.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
niji = ">= 1.0.1 and < 2.0.0"
plinth = ">= 0.10.2 and < 1.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.3.6 and < 3.0.0"

[tools.lustre.html]
body = """<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const path = params.get('path');
    if (path) {
      window.history.replaceState(null, null, path);
    }
  })();
</script><div id="app"></div>"""
title = "Kathrynne Winter's Website!"
links = [{ rel="icon", type="image/x-icon", href="/image/katylogo_diagonal_cherry.svg" }]
stylesheets = [
    { href="https://iosevka-webfonts.github.io/iosevka-slab/iosevka-slab.css" },
    { href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap" },
    { href="https://www.nerdfonts.com/assets/css/webfont.css" },
    { href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" },
    { href="/style/style.css"}
]
